<div class="new-post-container">
  <header class="header">
    <div class="logo">
      <img src="/assets/logo.png" alt="CTU Logo" class="logo-img">
      <span>CTU FORUM</span>
    </div>
  </header>
  <main class="main-content">
    <h1>Create a New Post</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="input-group">
        <input type="text" placeholder="Post Title" [(ngModel)]="title" name="title" required>
      </div>
      <div class="input-group">
        <textarea placeholder="Description" [(ngModel)]="description" name="description" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit Post</button>
    </form>
  </main>
</div>
